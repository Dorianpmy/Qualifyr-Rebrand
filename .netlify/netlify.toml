[build]
edge_functions = "/Users/dorian/Documents/Codex/Qualifyr-Rebrand/netlify/edge-functions"
publish = "/Users/dorian/Documents/Codex/Qualifyr-Rebrand/.next"
publishOrigin = "ui"
commandOrigin = "ui"
command = "npm run build"

[build.environment]
NEXT_PUBLIC_SITE_INDEXABLE = "true"
NEXT_PUBLIC_SITE_URL = "https://qualifyragence.com"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]

[[plugins]]
origin = "default"
package = "@netlify/plugin-nextjs"

[plugins.inputs]

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200.0
force = false

[redirects.query]
